<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="enlens-token" content="{{ENLENS_TOKEN}}">
<meta name="enlens-version" content="{{ENLENS_VERSION}}">
<meta name="color-scheme" content="light dark">
<title>ENLENS · explore and check your documents</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/v07.css">
<link rel="stylesheet" href="/static/concepts-themes.css">
<link rel="stylesheet" href="/static/profile-viewer.css">
<link rel="stylesheet" href="/static/v09.css">
<link rel="stylesheet" href="/static/v010.css">
<link rel="stylesheet" href="/static/v0101.css">
<link rel="stylesheet" href="/static/v0102.css">
<link rel="stylesheet" href="/static/v011.css">
<link rel="stylesheet" href="/static/v0111.css">
<link rel="stylesheet" href="/static/v0112.css">
<link rel="stylesheet" href="/static/v0113.css">
<link rel="stylesheet" href="/static/v012.css">
<link rel="stylesheet" href="/static/v013.css">
<link rel="stylesheet" href="/static/v0133.css">
<link rel="stylesheet" href="/static/v0134.css">
<link rel="stylesheet" href="/static/navigation.css">
<!-- release stylesheets end -->
<link rel="stylesheet" href="/static/site.css">
<script type="module" src="/static/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="shell" id="shell">
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="menu-btn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"></button>
    <a class="brand brand-small" href="#/overview" aria-label="ENLENS home">
      <img src="/static/logo.svg" alt="" width="26" height="26">
      <span>ENLENS</span>
    </a>
    <span class="topbar-project" id="topbar-project"></span>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Sidebar">
    <div class="sidebar-inner">
      <a class="brand" href="#/overview" aria-label="ENLENS home">
        <img src="/static/logo.svg" alt="" width="34" height="34">
        <span class="brand-text"><strong>ENLENS</strong></span>
      </a>
      <div class="project-switch" id="project-switch"></div>
      <!-- 0.17.0: Find a feature or page by name (finder.js); Ctrl+K or Cmd+K from anywhere -->
      <button class="find-btn" id="find-btn" type="button" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K"><span class="nav-icon" data-icon="search"></span><span class="find-text">Find a feature or page</span><kbd class="find-key" id="find-key">Ctrl K</kbd></button>
      <!-- 0.17.0: the places (features.js PLACES). A place's views are tabs on its pages, never links here. -->
      <nav class="nav" aria-label="Main" id="nav">
        <a href="#/overview" data-route="overview"><span class="nav-icon" data-icon="grid"></span><span>Overview</span></a>
        <a href="#/sources" data-route="documents"><span class="nav-icon" data-icon="book-open"></span><span>Documents</span></a>
        <span class="nav-group" role="presentation" data-section="explore">Explore</span>
        <a href="#/search" data-route="search"><span class="nav-icon" data-icon="text-search"></span><span>Search</span></a>
        <a href="#/profile" data-route="codes"><span class="nav-icon" data-icon="tag"></span><span>Codes</span></a>
        <a href="#/concepts" data-route="concepts"><span class="nav-icon" data-icon="network"></span><span>Concepts</span></a>
        <a href="#/themes" data-route="themes"><span class="nav-icon" data-icon="shapes"></span><span>Themes</span></a>
        <span class="nav-group" role="presentation" data-section="check">Check</span>
        <a href="#/hypotheses" data-route="hypotheses"><span class="nav-icon" data-icon="flask"></span><span>Hypotheses</span></a>
      </nav>
      <div class="sidebar-foot">
        <!-- 0.17.0: one status area of a fixed size: where text goes (the AI line); while work runs or waits, the work
             in its place, with only what matters and one action (app.js renderStatus) -->
        <div class="status-area" id="status-area">
          <div class="work-box" id="work-indicator" hidden></div>
          <div id="privacy-indicator"></div>
        </div>
        <div class="sidebar-app">
          <div class="sidebar-app-row">
            <nav class="nav nav-foot" id="nav-foot" aria-label="App">
              <a href="#/settings" data-route="settings" title="The AI (Claude Code, a local model), checking, exploring, documents, and the version"><span class="nav-icon" data-icon="sliders"></span><span>Settings</span></a>
            </nav>
            <!-- an update takes Quit's place (Quit is then in Settings › Technical) -->
            <button class="btn btn-ghost btn-sm" id="update-btn" type="button" hidden></button>
            <button class="btn btn-ghost btn-sm" id="quit-btn" type="button" hidden></button>
            <button class="icon-btn theme-btn" id="theme-btn" type="button" aria-live="polite"></button>
          </div>
        </div>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="main" tabindex="-1">
    <div id="stopped-banner"></div>
    <div id="update-banner"></div>
    <div id="quicklook-banner"></div>
    <div class="view" id="view" aria-busy="true"><p class="muted">Loading…</p></div>
  </main>
</div>
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="dialogs"></div>
</body>
</html>
