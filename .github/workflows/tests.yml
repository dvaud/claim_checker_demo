# ENLENS tests (0.14.3; 0.15: on Linux, macOS and Windows): the test suite on every push to main and every pull
# request, so a defect is caught when it lands rather than when a release is tagged. The release workflow
# (release.yml) does not run the tests again when this workflow has passed on the tagged commit.
# 2026-11-12: the tests run side by side (pytest-xdist: -n), each with a 10-minute limit (pytest-timeout), so a test
# that hangs fails with its stack instead of holding the job until its timeout. Windows, the slowest system (about 35
# minutes one test at a time, 18 with 8 side by side), is split over four machines of four (ENLENS_TEST_SHARD, see
# tests/conftest.py). 8 side by side on its 4 cores was a little faster per machine, but it slowed the heaviest tests
# tenfold, which widens every timing gap a test can fall into. The 25 slowest tests of each job are listed at the end
# of its log.
# 2026-11-12: Linux on Python 3.13 installs every optional extra (the Claude API, OCR with Tesseract, and `ci`: PyYAML and ruff), so the
# tests that skip elsewhere run here, and CI, not a full run on the developer's laptop, is where the whole suite runs.
# The other jobs keep the usual extras, so a test that needs one must still skip without it. CI runs the tests marked
# heavy (a local run of the whole suite leaves them out) and 10 seeds of the random runs; nightly.yml runs 30.
# 0.18.1 (roadmap J1.7): the install is from uv.lock (`uv sync --frozen`: the exact versions of every package, so a
# run is the same next month; Dependabot proposes updates in pull requests), every action is pinned by its commit
# hash (the tag is the comment), and the checkout has the whole history with its tags, since the package's version is
# made from the git tag (setuptools-scm, pyproject.toml): without tags it would be 0.0.0.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory }}
    timeout-minutes: 30
    env:
      # the test files are UTF-8 and many read them with read_text(); Windows would read them as cp1252
      PYTHONUTF8: "1"
      ENLENS_TEST_SHARD: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # workers: "auto" is one per core (4 on Linux and Windows, 3 on macOS)
          - {os: ubuntu-latest, python: "3.10", label: "Linux, Python 3.10", lint: false, advisory: false, workers: auto, shard: "", extras: "dev,connector,fast,pdfminer", all: false}
          - {os: ubuntu-latest, python: "3.13", label: "Linux, Python 3.13, every extra", lint: true, advisory: false, workers: auto, shard: "", extras: "dev,connector,fast,pdfminer,anthropic,ocr,ci", all: true}
          # 0.15: advisory until the suite passed there; 0.15.7: it does, so a failure on macOS or Windows fails the run
          - {os: macos-latest, python: "3.12", label: "macOS, Python 3.12", lint: false, advisory: false, workers: auto, shard: "", extras: "dev,connector,fast,pdfminer", all: false}
          - {os: windows-latest, python: "3.12", label: "Windows, Python 3.12, part 1 of 4", lint: false, advisory: false, workers: auto, shard: "1/4", extras: "dev,connector,fast,pdfminer", all: false}
          - {os: windows-latest, python: "3.12", label: "Windows, Python 3.12, part 2 of 4", lint: false, advisory: false, workers: auto, shard: "2/4", extras: "dev,connector,fast,pdfminer", all: false}
          - {os: windows-latest, python: "3.12", label: "Windows, Python 3.12, part 3 of 4", lint: false, advisory: false, workers: auto, shard: "3/4", extras: "dev,connector,fast,pdfminer", all: false}
          - {os: windows-latest, python: "3.12", label: "Windows, Python 3.12, part 4 of 4", lint: false, advisory: false, workers: auto, shard: "4/4", extras: "dev,connector,fast,pdfminer", all: false}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the package's version is made from the git tag
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Tesseract (OCR)
        if: ${{ matrix.all }}
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - name: Install (from uv.lock)
        shell: bash   # the same on Windows (Git Bash): each extra becomes an --extra option
        run: |
          uv lock --check
          flags=""
          for e in ${EXTRAS//,/ }; do flags="$flags --extra $e"; done
          uv sync --frozen $flags
        env:
          EXTRAS: ${{ matrix.extras }}
      - name: Lint (syntax errors and undefined names only)
        if: ${{ matrix.lint }}
        run: uv run --frozen --no-sync ruff check --select E9,F63,F7,F82 src tests tools
      - name: Test
        run: uv run --frozen --no-sync python -m pytest -q -rs -n ${{ matrix.workers }} --dist worksteal --timeout=600 --durations=25
