# ENLENS tests (0.14.3; 0.15: on Linux, macOS and Windows): the test suite on every push to main and every pull
# request, so a defect is caught when it lands rather than when a release is tagged. The release workflow
# (release.yml) still runs the tests again on the tag.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory }}
    timeout-minutes: 45
    env:
      # the test files are UTF-8 and many read them with read_text(); Windows would read them as cp1252
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10", label: "Linux, Python 3.10", lint: false, advisory: false}
          - {os: ubuntu-latest, python: "3.13", label: "Linux, Python 3.13", lint: true, advisory: false}
          # 0.15: advisory until the suite passes there (its first runs on macOS and Windows, see CHANGELOG 0.15.0):
          # a red result shows, but does not make the run fail
          - {os: macos-latest, python: "3.12", label: "macOS, Python 3.12, advisory", lint: false, advisory: true}
          - {os: windows-latest, python: "3.12", label: "Windows, Python 3.12, advisory", lint: false, advisory: true}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,connector,fast,pdfminer]"
      - name: Lint (syntax errors and undefined names only)
        if: ${{ matrix.lint }}
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 src tests tools
      - name: Test
        run: python -m pytest -q
