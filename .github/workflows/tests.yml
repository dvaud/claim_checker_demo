# ENLENS tests (0.14.3): the test suite on every push to main and every pull request, so a defect is caught when it
# lands rather than when a release is tagged. The release workflow (release.yml) still runs the tests again on the tag.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,connector,fast]'
      - name: Test
        run: python -m pytest -q
