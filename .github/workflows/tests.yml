# ENLENS tests (0.14.3; 0.15: on Linux, macOS and Windows): the test suite on every push to main and every pull
# request, so a defect is caught when it lands rather than when a release is tagged. The release workflow
# (release.yml) does not run the tests again when this workflow has passed on the tagged commit.
# 2026-11-12: the tests run side by side (pytest-xdist: -n), each with a 10-minute limit (pytest-timeout), so a test
# that hangs fails with its stack instead of holding the job until its timeout. Windows, the slowest system (about 35
# minutes one test at a time, 18 with 8 side by side), is split over three machines (ENLENS_TEST_SHARD, see
# tests/conftest.py). The 25 slowest tests of each job are listed at the end of its log.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory }}
    timeout-minutes: 30
    env:
      # the test files are UTF-8 and many read them with read_text(); Windows would read them as cp1252
      PYTHONUTF8: "1"
      ENLENS_TEST_SHARD: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # workers: "auto" is one per core (4 on Linux, 3 on macOS); Windows waits on its disk more than on its
          # cores, so 8 side by side on its 4 cores were faster than 4 (trial of 2026-11-12)
          - {os: ubuntu-latest, python: "3.10", label: "Linux, Python 3.10", lint: false, advisory: false, workers: auto, shard: ""}
          - {os: ubuntu-latest, python: "3.13", label: "Linux, Python 3.13", lint: true, advisory: false, workers: auto, shard: ""}
          # 0.15: advisory until the suite passed there; 0.15.7: it does, so a failure on macOS or Windows fails the run
          - {os: macos-latest, python: "3.12", label: "macOS, Python 3.12", lint: false, advisory: false, workers: auto, shard: ""}
          - {os: windows-latest, python: "3.12", label: "Windows, Python 3.12, part 1 of 3", lint: false, advisory: false, workers: "8", shard: "1/3"}
          - {os: windows-latest, python: "3.12", label: "Windows, Python 3.12, part 2 of 3", lint: false, advisory: false, workers: "8", shard: "2/3"}
          - {os: windows-latest, python: "3.12", label: "Windows, Python 3.12, part 3 of 3", lint: false, advisory: false, workers: "8", shard: "3/3"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,connector,fast,pdfminer]"
      - name: Lint (syntax errors and undefined names only)
        if: ${{ matrix.lint }}
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 src tests tools
      - name: Test
        run: python -m pytest -q -n ${{ matrix.workers }} --dist worksteal --timeout=600 --durations=25
