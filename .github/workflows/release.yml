# ENLENS release (0.10). Pushing a tag v<version> tests ENLENS, builds the package, tries the one-line install on
# Linux, macOS and Windows, and uploads everything to a DRAFT GitHub Release: check it, then press Publish (the
# install line always takes the latest published release). Run it by hand ("Run workflow") to build test copies
# without a release: they are attached to the run.
# 0.13.5: the macOS install test is its own job and does not hold up the draft, since GitHub's Mac runners can
# stay unavailable for hours. Check that it is green (or re-run it) before pressing Publish.
# 0.14.5: the Windows and macOS jobs also try the files to double-click (Install-ENLENS-Windows.cmd,
# Install-ENLENS-macOS.zip), from a removed install, the way a double-click runs them.
# 0.15: a tag of a release candidate (v0.15.0rc1) drafts a pre-release. The install line and the app's Update take
# the latest full release (GitHub's "latest" leaves pre-releases out), so only someone who asks gets the candidate.
# 2026-11-12: the suite is not run again here. The Tests workflow (tests.yml) runs it on Linux, macOS and Windows on
# every push to main; the "tests" job below takes the result of its run of this very commit, waiting for it when the
# tag came with the commit (git push --follow-tags starts both at once), while the package is built and the install
# tried beside it. A failed Tests run stops the draft. Only without a Tests run of this commit (none, or one cancelled
# by a later push to main) does the job run the suite itself, on Linux. A release takes about as long as Tests
# (~8 minutes) instead of Tests and then the suite once more.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # to look up the Tests runs of this commit

jobs:
  tests:
    name: Tests of this commit (Linux, macOS, Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for the Tests run of this commit
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state() {   # "passed <url>", "running <url>", "failed <url>" or "none -"; a pull request's run tests a merge
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?head_sha=$GITHUB_SHA&per_page=50" --jq '
              [.workflow_runs[] | select(.event != "pull_request")] as $r
              | ([$r[] | select(.conclusion == "success")][0]) as $ok
              | ([$r[] | select(.status != "completed")][0]) as $going
              | ([$r[] | select(.conclusion == "failure" or .conclusion == "timed_out")][0]) as $bad
              | if $ok then "passed \($ok.html_url)" elif $going then "running \($going.html_url)"
                elif $bad then "failed \($bad.html_url)" else "none -" end'
          }
          start=$(date +%s); said=""
          while :; do
            read -r what url <<< "$(state || echo "none -")"
            waited=$(( $(date +%s) - start ))
            case "$what" in
              passed)
                echo "Tests passed on $GITHUB_SHA on Linux, macOS and Windows ($url): not running them again here."
                echo "here=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
              failed)
                echo "::error::Tests failed on $GITHUB_SHA ($url), so no release is drafted. Fix it in a new commit; or, if a test failed only by chance, re-run that run's failed jobs and then this run's."
                exit 1 ;;
              running)
                [ "$said" = "$url" ] || { echo "Waiting for Tests on $GITHUB_SHA ($url)."; said="$url"; }
                if [ "$waited" -gt 3300 ]; then
                  echo "::error::Tests has not finished on $GITHUB_SHA after 55 minutes ($url): re-run this job once it has."
                  exit 1
                fi ;;
              *)
                if [ "$waited" -ge 60 ]; then   # the run of a commit pushed with its tag appears within seconds
                  echo "No Tests run of $GITHUB_SHA to wait for (none, or cancelled by a later push): the tests run here, on Linux."
                  echo "here=true" >> "$GITHUB_OUTPUT"; exit 0
                fi ;;
            esac
            sleep 20
          done
      - uses: actions/checkout@v7
        if: steps.wait.outputs.here == 'true'
      - uses: actions/setup-python@v7
        if: steps.wait.outputs.here == 'true'
        with:
          python-version: "3.12"
      - name: Run the tests here (only without a Tests run of this commit)
        if: steps.wait.outputs.here == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,connector,fast,pdfminer]'
          python -m pytest -q -n auto --dist worksteal --timeout=600   # side by side, as in tests.yml

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the version (tag, pyproject.toml, __init__.py, CHANGELOG.md)
        id: version
        run: |
          python tools/release.py check "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          # a release joins its changelog fragments first (changes/*.md, 0.18.1); a run by hand on main may have some
          if [ "${{ github.ref_type }}" = "tag" ]; then python tools/release.py fragments --check; fi
          echo "prerelease=$(python tools/release.py prerelease)" >> "$GITHUB_OUTPUT"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,connector,fast,pdfminer]'
      - name: Build the package and the install scripts
        run: |
          pip install build
          python -m build --wheel --outdir dist
          python tools/release.py assets dist
          python tools/release.py notes > release-notes.md
      # 0.15 (roadmap J4.3): the validation report's half that needs no AI: how well each reader reads documents of
      # known text, and that reading is the same twice; a file of the release, beside its notes
      - name: Measure how documents are read
        run: python -m enlens_claims.cli measure --report dist/validation-report.md
      - uses: actions/upload-artifact@v7
        with:
          name: enlens-release
          path: |
            dist/
            release-notes.md

  try-install:
    name: One-line install on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ENLENS_NO_OPEN: "1"
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: enlens-release
      - name: Install with install.sh (the built package)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ENLENS_WHEEL="$(ls "$PWD"/dist/enlens_claims-*.whl)" sh dist/install.sh
          export PATH="$HOME/.local/bin:$PATH"
          BIN="$(uv tool dir --bin 2>/dev/null || echo "$HOME/.local/bin")"
          "$BIN/enlens" --help > /dev/null
          PY="$(uv tool dir 2>/dev/null || echo "$HOME/.local/share/uv/tools")/enlens-claims/bin/python"
          "$PY" -c "from enlens_claims import installation as i; assert i.kind() == 'script', i.kind(); print(i.info())"
          "$PY" -c "from enlens_claims import claude_setup as c; c.write_plugin(); r = c.check_connector(); print(r); assert r['ok']"
      - name: Install with install.ps1 (the built package)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ENLENS_WHEEL = (Get-ChildItem dist\enlens_claims-*.whl).FullName
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          . .\dist\install.ps1
          $bin = (uv tool dir --bin).Trim()
          & "$bin\enlens.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "enlens did not start" }
          $py = Join-Path (uv tool dir).Trim() 'enlens-claims\Scripts\python.exe'
          & $py -c "from enlens_claims import installation as i; assert i.kind() == 'script', i.kind(); print(i.info())"
          if ($LASTEXITCODE -ne 0) { throw "not recorded as a one-line install" }
          & $py -c "from enlens_claims import claude_setup as c; c.write_plugin(); r = c.check_connector(); print(r); assert r['ok']"
          if ($LASTEXITCODE -ne 0) { throw "the connector did not start" }
      # 0.15.5: on the user's PC the install line ran while Claude Code had ENLENS connected (its connector runs
      # ENLENS's own python.exe): uv removed part of ENLENS's folder, stopped with "Access is denied", and ENLENS no
      # longer started ("uv trampoline failed to canonicalize script path"). Here a stand-in for the connector runs
      # ENLENS's own Python while the install line runs in Windows PowerShell, as on that PC. One that closes: the
      # line waits for it and then installs. One that stays: the line stops, and ENLENS still starts.
      - name: Install while a program runs from ENLENS's folder
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        run: |
          $env:ENLENS_WHEEL = (Get-ChildItem dist\enlens_claims-*.whl).FullName
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          $bin = (uv tool dir --bin).Trim()
          $py = Join-Path (uv tool dir).Trim() 'enlens-claims\Scripts\python.exe'
          function Start-Connector([int]$Seconds) {
            # its command line names the connector's module, as Claude Code's does; it only sleeps
            Start-Process -FilePath $py -PassThru -WindowStyle Hidden `
              -ArgumentList "-c `"import sys, time; time.sleep(int(sys.argv[1]))`" $Seconds enlens_claims.mcp_server"
          }
          # 1. a connector that closes after 25 s: the line waits for it, then installs
          $c = Start-Connector 25
          Start-Sleep -Seconds 3
          if ($c.HasExited) { throw "the stand-in did not start" }
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File dist\install.ps1 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "Claude Code's ENLENS connector \(python\.exe, process $($c.Id)\)") { throw "the line did not name the connector" }
          if ($out -notmatch 'They have closed' -or $out -notmatch '4/4' -or $out -notmatch 'Done\. Next time' -or $out -match 'could not be installed') {
            throw "the line did not wait for the connector and then install"
          }
          & "$bin\enlens.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "enlens did not start" }
          # 2. a connector that stays: the line stops before uv touches anything, and ENLENS still starts
          $c = Start-Connector 600
          Start-Sleep -Seconds 3
          $env:ENLENS_FREE_WAIT = '8'
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File dist\install.ps1 2>&1 | Out-String
          Remove-Item Env:ENLENS_FREE_WAIT
          Write-Host $out
          $alive = -not $c.HasExited
          taskkill /pid $c.Id /t /f | Out-Null
          if (-not $alive) { throw "the stand-in ended early, so this showed nothing" }
          if ($out -notmatch "could not be installed: these programs still run from ENLENS's folder") { throw "the line did not stop" }
          if ($out -notmatch "process $($c.Id)" -or $out -notmatch 'Nothing was changed' -or $out -match '3/4') {
            throw "the line did not stop before installing, or did not say what to close"
          }
          & "$bin\enlens.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "ENLENS no longer starts: the line changed its folder after all" }
          & $py -c "import enlens_claims, pydantic; print('ENLENS', enlens_claims.__version__, 'is whole')"
          if ($LASTEXITCODE -ne 0) { throw "ENLENS's folder is not whole" }
          # 3. an ENLENS half removed by an older line (most of Scripts and Lib gone): the line installs it whole again
          $envDir = Split-Path (Split-Path $py -Parent) -Parent
          Remove-Item -Recurse -Force (Join-Path $envDir 'Lib\site-packages\enlens_claims'), (Join-Path $envDir 'Scripts\enlens.exe')
          & "$bin\enlens.exe" --help 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "the half-removed ENLENS still started, so this showed nothing" }
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File dist\install.ps1 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Done\. Next time' -or $out -match 'could not be installed') { throw "the line did not repair ENLENS" }
          & "$bin\enlens.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "ENLENS still does not start after the line" }
      - name: Install with Install-ENLENS-Windows.cmd, as a double-click runs it
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        run: |
          $env:ENLENS_WHEEL = (Get-ChildItem dist\enlens_claims-*.whl).FullName
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          $bin = (uv tool dir --bin).Trim()
          uv tool uninstall enlens-claims
          if (Test-Path "$bin\enlens.exe") { throw "enlens.exe is still there" }
          # a double-click runs `cmd /c <file>`; no input, so its closing "press any key" does not wait
          $out = cmd /d /c "dist\Install-ENLENS-Windows.cmd < NUL" 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "the file ended with $LASTEXITCODE" }
          if ($out -notmatch '4/4' -or $out -notmatch 'Done\. Next time' -or $out -match 'could not be installed') {
            throw "the file did not install ENLENS"
          }
          & "$bin\enlens.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "enlens did not start" }
          $py = Join-Path (uv tool dir).Trim() 'enlens-claims\Scripts\python.exe'
          & $py -c "from enlens_claims import installation as i; assert i.kind() == 'script', i.kind(); print(i.info())"
          if ($LASTEXITCODE -ne 0) { throw "not recorded as a one-line install" }
      # 0.15.2: 0.15.1 stopped at "enlens.exe is missing" for C:\Users\D<a-acute>vid (PowerShell read uv's UTF-8
      # answer in the console's code page), and would have put the Desktop icon in a folder that does not exist. Here
      # the user folder is "<A-acute>bel Gerg<o-double-acute>": a letter whose UTF-8 has a byte Windows-1252 lacks, a
      # letter Windows-1252 lacks (WScript.Shell cannot store it in a shortcut), and a space. uv itself, uv's folders,
      # the temporary folder, the Start menu, the Desktop and the downloaded install file are all in it, and the
      # console uses code page 852 (Hungarian), as on such a user's computer.
      - name: Install with Install-ENLENS-Windows.cmd for a user folder with accents and a space
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        run: |
          $env:ENLENS_WHEEL = (Get-ChildItem dist\enlens_claims-*.whl).FullName
          $uvHere = "$env:USERPROFILE\.local\bin"   # the uv the steps above installed
          $user = Join-Path $env:RUNNER_TEMP "$([char]0xC1)bel Gerg$([char]0x151)"
          $userBin = Join-Path $user '.local\bin'
          $downloads = Join-Path $user 'Downloads'
          New-Item -ItemType Directory -Force -Path $userBin, $downloads | Out-Null
          Copy-Item "$uvHere\uv*.exe" $userBin   # uv where its installer puts it for this user
          $env:Path = "$userBin;$env:Path"
          Copy-Item dist\Install-ENLENS-Windows.cmd $downloads
          $env:USERPROFILE = $user
          $env:HOME = $user
          $env:APPDATA = Join-Path $user 'AppData\Roaming'
          $env:LOCALAPPDATA = Join-Path $user 'AppData\Local'
          $env:TEMP = Join-Path $user 'AppData\Local\Temp'
          $env:TMP = $env:TEMP
          $desk = Join-Path $user 'Desktop'
          New-Item -ItemType Directory -Force -Path $env:APPDATA, $env:TEMP, $desk | Out-Null
          $shell = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders'
          if (-not (Test-Path $shell)) { New-Item -Path $shell -Force | Out-Null }
          New-ItemProperty -Path $shell -Name Desktop -Value $desk -PropertyType ExpandString -Force | Out-Null
          $out = cmd /d /c "chcp 852 >nul & `"$downloads\Install-ENLENS-Windows.cmd`" < NUL" 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "the file ended with $LASTEXITCODE" }
          # (the printed path may lose its accents in this pipe: its start, the ASCII runner folder, is enough)
          if ($out -notmatch "uv is here already \($([regex]::Escape($env:RUNNER_TEMP))") { throw "the install did not use this user's uv" }
          if ($out -notmatch '4/4' -or $out -notmatch 'Done\. Next time' -or $out -match 'could not be installed') {
            throw "the file did not install ENLENS"
          }
          # Does Windows PowerShell here still garble uv's answer as 0.15.1 read it? Otherwise this step no longer
          # shows that failure (it still checks everything else).
          Set-Content -Encoding ascii old-read.ps1 "if (Test-Path -LiteralPath (Join-Path ((& uv tool dir --bin) -join '').Trim() 'enlens.exe')) { 'read right' } else { 'garbled' }"
          $old = (cmd /d /c "chcp 852 >nul & powershell -NoProfile -ExecutionPolicy Bypass -File old-read.ps1" | Out-String).Trim()
          Write-Host "uv's answer as 0.15.1 read it: $old"
          if ($old -ne 'garbled') { Write-Host "::warning::uv's answer was read right the 0.15.1 way: this step no longer shows the 0.15.1 failure" }
          $env:PYTHONIOENCODING = 'utf-8'   # this step's own checks print the folder
          try { [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding $false } catch { }
          $enlens = Join-Path $userBin 'enlens.exe'
          if (-not (Test-Path -LiteralPath $enlens)) { throw "enlens.exe is not in $userBin" }
          & $enlens --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "enlens did not start" }
          $py = Join-Path (uv tool dir).Trim() 'enlens-claims\Scripts\python.exe'
          if (-not $py.StartsWith($user)) { throw "uv keeps ENLENS in $py, not in the user folder" }
          & $py -c "from enlens_claims import installation as i; assert i.kind() == 'script', i.kind(); print(i.info())"
          if ($LASTEXITCODE -ne 0) { throw "not recorded as a one-line install" }
          # both icons are shortcuts (not the command file made when no shortcut can be) that start this ENLENS;
          # Shell.Application reads them in UTF-16 (WScript.Shell would garble the target it reads back)
          $app = New-Object -ComObject Shell.Application
          foreach ($folder in @($desk, (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'))) {
            $link = Join-Path $folder 'ENLENS.lnk'
            if (-not (Test-Path -LiteralPath $link)) { throw "no ENLENS shortcut at $link" }
            $target = $app.Namespace($folder).ParseName('ENLENS.lnk').GetLink.Path
            if (-not $target.StartsWith($user) -or -not (Test-Path -LiteralPath $target)) {
              throw "the shortcut $link starts $target, which is not this ENLENS"
            }
            Write-Host "icon: $link -> $target"
          }
  try-install-mac:
    name: One-line install on macos-latest (does not hold up the draft)
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      ENLENS_NO_OPEN: "1"
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: enlens-release
      - name: Install with install.sh (the built package)
        shell: bash
        run: |
          ENLENS_WHEEL="$(ls "$PWD"/dist/enlens_claims-*.whl)" sh dist/install.sh
          export PATH="$HOME/.local/bin:$PATH"
          BIN="$(uv tool dir --bin 2>/dev/null || echo "$HOME/.local/bin")"
          "$BIN/enlens" --help > /dev/null
          PY="$(uv tool dir 2>/dev/null || echo "$HOME/.local/share/uv/tools")/enlens-claims/bin/python"
          "$PY" -c "from enlens_claims import installation as i; assert i.kind() == 'script', i.kind(); print(i.info())"
          "$PY" -c "from enlens_claims import claude_setup as c; c.write_plugin(); r = c.check_connector(); print(r); assert r['ok']"
      - name: Install with Install-ENLENS-macOS.zip, as a double-click runs it
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          BIN="$(uv tool dir --bin)"
          uv tool uninstall enlens-claims
          test ! -e "$BIN/enlens"
          # Archive Utility (a double-click, or Safari) unpacks as ditto does; the file must still be allowed to run
          ditto -x -k dist/Install-ENLENS-macOS.zip "$RUNNER_TEMP/double-click"
          CMD="$RUNNER_TEMP/double-click/Install ENLENS.command"
          test -x "$CMD"
          ENLENS_WHEEL="$(ls "$PWD"/dist/enlens_claims-*.whl)" "$CMD" | tee "$RUNNER_TEMP/double-click.log"
          grep -q "Done. Next time" "$RUNNER_TEMP/double-click.log"
          "$BIN/enlens" --help > /dev/null
          PY="$(uv tool dir)/enlens-claims/bin/python"
          "$PY" -c "from enlens_claims import installation as i; assert i.kind() == 'script', i.kind(); print(i.info())"

  release:
    name: Draft the GitHub Release
    needs: [build, try-install, tests]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: enlens-release
      - name: Upload to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --draft --verify-tag \
            ${{ needs.build.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            --title "ENLENS ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
